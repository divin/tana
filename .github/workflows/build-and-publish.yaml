name: Build and publish Tana

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Match numeric-starting tags broadly; the publish job validates exact X.Y.Z.
    tags:
      - "[0-9]*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify backend, frontend, and container
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      # uv is installed via the official astral-sh/setup-uv action, pinned to
      # the exact release used by the Dockerfile build stage. Keep the version
      # here, in the Dockerfile, and in the lockfile in sync when bumping.
      # astral-sh/setup-uv v10.3.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install pinned Zola 0.23.6
        shell: bash
        run: |
          set -euo pipefail
          archive="zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/getzola/zola/releases/download/v0.23.6/${archive}" \
            --output "/tmp/${archive}"
          echo "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4  /tmp/${archive}" | sha256sum --check --status
          tar -xzf "/tmp/${archive}" -C /tmp zola
          sudo install /tmp/zola /usr/local/bin/zola
          zola --version

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups

      - name: Check and build Zola site
        run: |
          zola --root frontend check --skip-external-links
          zola --root frontend build

      - name: Check backend formatting and lint
        working-directory: backend
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Test backend
        working-directory: backend
        run: uv run pytest tests -q

      - name: Test frontend
        working-directory: frontend
        run: node --test

      - name: Build container image
        run: docker build --tag tana:ci .

  publish:
    name: Publish GHCR image
    # Only tag pushes create images; pushes to main run verify only.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # docker/setup-buildx-action v3.10.0
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      # docker/login-action v3.4.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')"
          owner="${REPOSITORY%%/*}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/tana"
          if [[ "$REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] && [[ "$REF_NAME" == "$package_version" ]]; then
            tags="${image}:latest,${image}:${REF_NAME}"
          else
            echo "Tag ${REF_NAME} is not a plain semantic version matching backend package version ${package_version}; refusing to publish" >&2
            exit 1
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      # docker/build-push-action v6.18.0
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
